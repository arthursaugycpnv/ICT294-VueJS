<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Apprendre Vue.js</title>
</head>

<body>
    <div id="app">
        <h1>{{ product }}</h1>
        <!-- Les conditions doivent être à la suite 
        ++ Pas de même balises imbriquées -->
        <div v-if="isAvailable">
            <p>Prix : {{ price }} CHF</p>
            <p>
                Quantité : {{ quantity }}
                <button @click="decreaseQuantity">-</button>
                <button @click="increaseQuantity">+</button>
            </p>
            <p>Total : <b>{{totalPrice}} CHF</b></p>
        </div>
        <div v-else-if="quantity === 0">
            <p>Rupture stock / Aucune quantité à acheter </p>
        </div>
        <div v-else>
            <p>Produit indisponible</p>
        </div>


    </div>
    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    product: "Chaussettes",
                    price: 12,
                    quantity: 2,
                    isAvailable: false,
                };
            },
            methods: {
                increaseQuantity() {
                    this.quantity++;
                },
                decreaseQuantity() {
                    this.quantity--;
                },
            },
            computed: {
                totalPrice() {
                    return this.price * this.quantity;
                }
            }
        }).mount("#app");
    </script>
</body>

</html>
