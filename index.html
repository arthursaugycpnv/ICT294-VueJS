<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Apprendre Vue.js</title>
</head>

<body>
    <div id="app">
        <h1>{{ product }}</h1>
        <p>Prix : {{ price }} CHF</p>
        <p>
            Quantité : {{ quantity }}
            <button @click="increaseQuantity">+</button>
            <button @click="decreaseQuantity">-</button>
        </p>
        <p>Total : <b>{{totalPrice}} CHF</b></p>

    </div>
    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    product: "Chaussettes",
                    price: 12,
                    quantity: 2,
                };
            },
            methods: {
                increaseQuantity() {
                    this.quantity++;
                },
                decreaseQuantity() {
                    this.quantity--;
                },
            },
            computed: {
                totalPrice() {
                    return this.price * this.quantity;
                }
            }
        }).mount("#app");
    </script>
</body>

</html>
